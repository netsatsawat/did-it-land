id: stripe.charge
provider: stripe
operation: charge
schema_version: "1"
summary: >
  Create a payment on Stripe. After an ambiguous crash, answer whether the charge
  was created, and reverse it with a refund.

idempotency:
  strategy: client_key
  header: Idempotency-Key
  notes: >
    Send a client-generated Idempotency-Key with the create request. A retry with
    the same key returns the original result instead of charging again. The key
    must be generated by the caller before the first attempt, never regenerated on
    retry, or the deduplication is bypassed.

probe:
  kind: http
  request:
    method: GET
    path: /v1/payment_intents/search
    query:
      query: 'metadata["order_id"]:"{order_id}"'
  interpret:
    - when:
        status_in: [200]
        json_path: data
        count_gte: 1
      result: landed
    - when:
        status_in: [200]
      result: not_landed
    - when:
        status_in: [429, 500, 502, 503]
      result: unknown

reversibility:
  class: reversible

compensation:
  kind: http
  request:
    method: POST
    path: /v1/refunds
    query:
      payment_intent: "{payment_intent_id}"
  notes: >
    Refund the payment intent found by the probe. A refund is a genuine reversal of
    the money movement, so this operation is fully reversible.

notes: >
  The probe uses the Search API keyed on the order_id you attach as metadata, which
  copies from the payment intent to its charge. Search is eventually consistent and
  can lag a created charge by a short window, so a not_landed result immediately
  after a crash should be re-checked before acting on it.
source: https://docs.stripe.com/api/payment_intents/search
