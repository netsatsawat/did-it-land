id: stripe.charge
provider: stripe
operation: charge
schema_version: "1"
summary: >
  Create a payment on Stripe. After an ambiguous crash, answer whether money actually
  moved, and reverse it with a refund.

idempotency:
  strategy: client_key
  header: Idempotency-Key
  notes: >
    Send a client-generated Idempotency-Key with the create request. A retry with
    the same key returns the saved result of the first attempt instead of charging
    again. The key must be derived from state that survives the crash, such as the
    order id, never minted inside the step, or a re-run bypasses the deduplication.
    Stripe prunes idempotency keys after 24 hours, so a late recovery cannot rely
    on key replay and needs the probe below.

probe:
  kind: http
  request:
    method: GET
    path: /v1/payment_intents/search
    query:
      query: 'metadata["order_id"]:"{order_id}"'
  interpret:
    - when:
        status_in: [200]
        json_path: data
        where:
          status: succeeded
        count_gte: 1
      result: landed
    - when:
        status_in: [200]
        json_path: data
        where:
          status: processing
        count_gte: 1
      result: unknown
    - when:
        status_in: [200]
      result: not_landed
    - when:
        status_in: [429, 500, 502, 503]
      result: unknown
  confirm:
    request:
      method: GET
      path: /v1/payment_intents
      query:
        limit: "100"
    interpret:
      - when:
          status_in: [200]
          json_path: data
          where:
            metadata.order_id: "{order_id}"
            status: succeeded
          count_gte: 1
        result: landed
      - when:
          status_in: [200]
          json_path: data
          where:
            metadata.order_id: "{order_id}"
            status: processing
          count_gte: 1
        result: unknown
      - when:
          status_in: [200]
        result: not_landed
      - when:
          status_in: [429, 500, 502, 503]
        result: unknown
    notes: >
      Search can lag a just-created charge, so an empty search answer is never
      trusted on its own. This second question walks the List API, which Stripe
      does not subject to search indexing lag, filtering the most recent hundred
      intents client-side by the caller's order id. Only after the List also comes
      back empty does the capsule answer not_landed. A burst of more than a
      hundred intents between the crash and the recovery could still hide the
      charge from this page, which is why the request keeps limit at the maximum.

reversibility:
  class: reversible

compensation:
  kind: http
  request:
    method: POST
    path: /v1/refunds
    query:
      payment_intent: "{payment_intent_id}"
    headers:
      Idempotency-Key: "did-it-land-refund-{payment_intent_id}"
  notes: >
    Refund the payment intent found by the probe, with its own idempotency key
    derived from the payment intent id, so a crashed compensation cannot refund
    twice either. A refund reverses the money movement but Stripe keeps the
    original processing fees, and on some asynchronous payment methods a refund
    can fail after being accepted, so treat compensated as accepted, not settled.

notes: >
  The probe asks a sharper question than "does a payment intent exist". It filters
  the search results by status, because an intent stuck at requires_payment_method
  is a declined card, not a landed charge, and one in processing is money in
  flight, which is honestly unknown. A matched count above one means a duplicate
  already exists and one intent needs refunding; the count is surfaced in the
  outcome's evidence. Two consistency caveats from Stripe's own documentation:
  search is not for read-after-write flows, since new records can take a short
  while to become searchable, so an empty result immediately after a crash should
  be re-checked after a delay (the List API is not subject to that lag and can
  serve as the fallback); and status filtered in the query text can be served
  from a cache, which is why the filtering here happens client-side against the
  returned objects.
source:
  - https://docs.stripe.com/api/payment_intents/search
  - https://docs.stripe.com/api/payment_intents/list
  - https://docs.stripe.com/api/idempotent_requests
  - https://docs.stripe.com/metadata
  - https://docs.stripe.com/search
  - https://docs.stripe.com/payments/paymentintents/lifecycle
