[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "effectkit"
version = "0.1.0"
description = "Know whether a side-effect landed, and how to reverse it: a corpus of per-vendor effect capsules for durable and saga workflows."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Satsawat Natakarnkitkul" }]
requires-python = ">=3.10"
dependencies = ["pyyaml>=6.0"]
keywords = ["durable-execution", "saga", "idempotency", "reconciliation", "agents", "dbos"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
    "License :: OSI Approved :: MIT License"]

[project.optional-dependencies]
http = ["httpx>=0.27"]
dbos = ["dbos>=0.10"]

[project.urls]
Homepage = "https://github.com/netsatsawat/effectkit"
Documentation = "https://github.com/netsatsawat/effectkit/blob/main/docs/CAPSULE-SCHEMA.md"

[project.scripts]
effectkit = "effectkit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
effectkit = ["_corpus/*.yaml"]
