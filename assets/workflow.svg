<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="940" viewBox="0 0 1240 940">
<defs><marker id="ab" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#444"/></marker><marker id="am" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#9a2b2b"/></marker><marker id="aw" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#555"/></marker></defs>
<rect width="1240" height="940" fill="#ffffff"/>
<text x="620" y="42" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" fill="#57606a" text-anchor="middle" font-weight="600" >The crash-recovery workflow</text>
<rect x="545.0" y="66.0" width="150" height="44" rx="22" fill="#1a9988" stroke="#1a9988" stroke-width="1.6"/>
<text x="620" y="93.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2328" text-anchor="middle" font-weight="normal" >Start</text>
<text x="620" y="93.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="600" >Start</text>
<rect x="450.0" y="142.0" width="340" height="52" rx="14" fill="#3d7dd8" stroke="#3d7dd8" stroke-width="1.6"/>
<text x="620" y="173.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2328" text-anchor="middle" font-weight="normal" ></text>
<text x="620" y="163.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="600" >A workflow step calls</text>
<text x="620" y="183.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="600" >an external service</text>
<rect x="450.0" y="232.0" width="340" height="52" rx="14" fill="#d9534f" stroke="#d9534f" stroke-width="1.6"/>
<text x="620" y="263.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2328" text-anchor="middle" font-weight="normal" ></text>
<text x="620" y="253.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="600" >The process crashes</text>
<text x="620" y="273.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="600" >before the checkpoint</text>
<rect x="450.0" y="322.0" width="340" height="52" rx="14" fill="#7d5ba6" stroke="#7d5ba6" stroke-width="1.6"/>
<text x="620" y="353.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2328" text-anchor="middle" font-weight="normal" ></text>
<text x="620" y="343.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="600" >Recovery probes with the</text>
<text x="620" y="363.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="600" >operation's capsule</text>
<path d="M620,413.0 L730.0,468 L620,523.0 L510.0,468 z" fill="#f0a030"/>
<text x="620" y="463.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="600" >Did it</text>
<text x="620" y="482.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="600" >land?</text>
<rect x="140.0" y="442.0" width="280" height="52" rx="14" fill="#3d9a50" stroke="#3d9a50" stroke-width="1.6"/>
<text x="280" y="473.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2328" text-anchor="middle" font-weight="normal" ></text>
<text x="280" y="463.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="600" >Skip the retry,</text>
<text x="280" y="483.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="600" >reuse the result</text>
<rect x="820.0" y="442.0" width="280" height="52" rx="14" fill="#3d7dd8" stroke="#3d7dd8" stroke-width="1.6"/>
<text x="960" y="473.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2328" text-anchor="middle" font-weight="normal" ></text>
<text x="960" y="463.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="600" >Run the step,</text>
<text x="960" y="483.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="600" >same idempotency key</text>
<rect x="480.0" y="564.0" width="280" height="52" rx="14" fill="#f0a030" stroke="#f0a030" stroke-width="1.6"/>
<text x="620" y="595.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2328" text-anchor="middle" font-weight="normal" ></text>
<text x="620" y="585.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="600" >Wait, then</text>
<text x="620" y="605.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="600" >probe again</text>
<rect x="450.0" y="674.0" width="340" height="52" rx="14" fill="#455a64" stroke="#455a64" stroke-width="1.6"/>
<text x="620" y="705.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2328" text-anchor="middle" font-weight="normal" ></text>
<text x="620" y="695.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="600" >Checkpoint written:</text>
<text x="620" y="715.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="600" >exactly one effect</text>
<path d="M620,760.0 L725.0,810 L620,860.0 L515.0,810 z" fill="#7d5ba6"/>
<text x="620" y="805.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="600" >Roll</text>
<text x="620" y="824.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="600" >back?</text>
<rect x="820.0" y="784.0" width="280" height="52" rx="14" fill="#d9534f" stroke="#d9534f" stroke-width="1.6"/>
<text x="960" y="815.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2328" text-anchor="middle" font-weight="normal" ></text>
<text x="960" y="805.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="600" >Unwind runs the</text>
<text x="960" y="825.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="600" >compensation</text>
<rect x="205.0" y="788.0" width="150" height="44" rx="22" fill="#1a9988" stroke="#1a9988" stroke-width="1.6"/>
<text x="280" y="815.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2328" text-anchor="middle" font-weight="normal" ></text>
<text x="280" y="815.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="600" >Done</text>
