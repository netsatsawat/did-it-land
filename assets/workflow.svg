<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1080" viewBox="0 0 1280 1080">
<defs><marker id="ab" markerWidth="9" markerHeight="7" refX="7.5" refY="3.5" orient="auto"><path d="M0,0 L8.5,3.5 L0,7 z" fill="#444"/></marker><marker id="am" markerWidth="9" markerHeight="7" refX="7.5" refY="3.5" orient="auto"><path d="M0,0 L8.5,3.5 L0,7 z" fill="#9a2b2b"/></marker><marker id="ag" markerWidth="9" markerHeight="7" refX="7.5" refY="3.5" orient="auto"><path d="M0,0 L8.5,3.5 L0,7 z" fill="#8a939c"/></marker></defs>
<rect width="1280" height="1080" fill="#ffffff"/>
<text x="640" y="50" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="23" fill="#57606a" text-anchor="middle" font-weight="600" >The crash-recovery workflow</text>
<rect x="550.0" y="79.0" width="180" height="54" rx="27" fill="#1a9988"/>
<text x="640" y="112.33333333333333" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" fill="#ffffff" text-anchor="middle" font-weight="600" >Start</text>
<rect x="435.0" y="163.0" width="410" height="66" rx="14" fill="#3d7dd8"/>
<text x="640" y="190.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="600" >A workflow step calls</text>
<text x="640" y="214.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="600" >an external service</text>
<rect x="435.0" y="263.0" width="410" height="66" rx="14" fill="#d9534f"/>
<text x="640" y="290.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="600" >The process crashes</text>
<text x="640" y="314.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="600" >before the checkpoint</text>
<rect x="435.0" y="363.0" width="410" height="66" rx="14" fill="#7d5ba6"/>
<text x="640" y="390.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="600" >Recovery probes with the</text>
<text x="640" y="414.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="600" >operation's capsule</text>
<path d="M640,464.0 L770.0,532 L640,600.0 L510.0,532 z" fill="#f0a030"/>
<text x="640" y="526.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="600" >Did it</text>
<text x="640" y="550.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="600" >land?</text>
<rect x="120.0" y="499.0" width="320" height="66" rx="14" fill="#3d9a50"/>
<text x="280" y="526.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="600" >Skip the retry,</text>
<text x="280" y="550.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="600" >reuse the result</text>
<rect x="840.0" y="499.0" width="320" height="66" rx="14" fill="#3d7dd8"/>
<text x="1000" y="526.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="600" >Run the step,</text>
<text x="1000" y="550.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="600" >same idempotency key</text>
<rect x="485.0" y="635.0" width="310" height="66" rx="14" fill="#f0a030"/>
<text x="640" y="662.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="600" >Wait, then</text>
<text x="640" y="686.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="600" >probe again</text>
<rect x="440.0" y="767.0" width="400" height="66" rx="14" fill="#455a64"/>
<text x="640" y="794.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="600" >Checkpoint written:</text>
<text x="640" y="818.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="600" >exactly one effect</text>
<path d="M640,864.0 L760.0,922 L640,980.0 L520.0,922 z" fill="#7d5ba6"/>
<text x="640" y="916.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="600" >Roll</text>
<text x="640" y="940.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="600" >back?</text>
<rect x="840.0" y="889.0" width="320" height="66" rx="14" fill="#d9534f"/>
<text x="1000" y="916.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="600" >Unwind runs the</text>
<text x="1000" y="940.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="600" >compensation</text>
<rect x="190.0" y="895.0" width="180" height="54" rx="27" fill="#1a9988"/>
<text x="280" y="928.3333333333334" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" fill="#ffffff" text-anchor="middle" font-weight="600" >Done</text>
<line x1="640" y1="133" x2="640" y2="159" stroke="#444" stroke-width="2.4" marker-end="url(#ab)"/>
<line x1="640" y1="229" x2="640" y2="259" stroke="#444" stroke-width="2.4" marker-end="url(#ab)"/>
<line x1="640" y1="329" x2="640" y2="359" stroke="#444" stroke-width="2.4" marker-end="url(#ab)"/>
<line x1="640" y1="429" x2="640" y2="460" stroke="#444" stroke-width="2.4" marker-end="url(#ab)"/>
<line x1="510" y1="532" x2="444" y2="532" stroke="#444" stroke-width="2.4" marker-end="url(#ab)"/>
<text x="460" y="516" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" fill="#57606a" text-anchor="start" font-weight="normal" >yes</text>
<line x1="770" y1="532" x2="836" y2="532" stroke="#444" stroke-width="2.4" marker-end="url(#ab)"/>
<text x="792" y="516" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" fill="#57606a" text-anchor="start" font-weight="normal" >no</text>
<line x1="640" y1="600" x2="640" y2="631" stroke="#444" stroke-width="2.4" marker-end="url(#ab)"/>
<text x="656" y="620" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" fill="#57606a" text-anchor="start" font-weight="normal" >unknown</text>
<path d="M480,668 L293,668 A13,13 0 0 0 267,668 L172,668 Q158,668 158,654 L158,410 Q158,396 172,396 L431,396" fill="none" stroke="#8a939c" stroke-width="2.4" marker-end="url(#ag)"/>
<path d="M280,565 L280,786 Q280,800 294,800 L436,800" fill="none" stroke="#444" stroke-width="2.4" marker-end="url(#ab)"/>
<path d="M1000,565 L1000,786 Q1000,800 986,800 L844,800" fill="none" stroke="#444" stroke-width="2.4" marker-end="url(#ab)"/>
<line x1="640" y1="833" x2="640" y2="860" stroke="#444" stroke-width="2.4" marker-end="url(#ab)"/>
<line x1="765" y1="922" x2="836" y2="922" stroke="#444" stroke-width="2.4" marker-end="url(#ab)"/>
<text x="788" y="906" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" fill="#57606a" text-anchor="start" font-weight="normal" >yes</text>
<line x1="515" y1="922" x2="374" y2="922" stroke="#444" stroke-width="2.4" marker-end="url(#ab)"/>
<text x="436" y="906" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" fill="#57606a" text-anchor="start" font-weight="normal" >no</text>
<path d="M1000,955 L1000,1006 Q1000,1020 986,1020 L294,1020 Q280,1020 280,1006 L280,953" fill="none" stroke="#444" stroke-width="2.4" marker-end="url(#ab)"/>
